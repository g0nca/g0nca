<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Menu — Bamboo, Furadouro">
  <meta name="theme-color" content="#E9DCC3">
  <title>Bamboo · Menu</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%232F1E14'/%3E%3Ctext x='8' y='12' font-size='11' text-anchor='middle' fill='%23F2EDE4' font-family='serif'%3EB%3C/text%3E%3C/svg%3E">
</head>
<body>

  <header class="cabecalho">

      <p class="marca">
        <span class="marca-nome">Bamboo</span>
        <span class="marca-local">Furadouro</span>
      </p>
      <nav class="idiomas" id="idiomas" aria-label="Idioma"></nav>
    </div>
    <p class="zona" id="zona" hidden></p>
  </header>

  <nav class="categorias" id="categorias" aria-label="Categorias do menu"></nav>

  <main id="menu">
    <noscript>
      <p class="noscript">Este menu precisa de JavaScript. / This menu requires JavaScript.</p>
    </noscript>
  </main>

  <footer class="rodape">
    <p class="rodape-info" id="rodape-info"></p>
    <p class="rodape-redes" id="rodape-redes"></p>
    <details class="alergenios-legenda" id="alergenios-legenda"></details>
    <p class="rodape-nota" id="rodape-nota"></p>
  </footer>

  <button class="topo" id="topo" type="button" hidden>
    <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
      <path d="M10 4 3 11l1.4 1.4L9 7.8V16h2V7.8l4.6 4.6L17 11z" fill="currentColor"/>
    </svg>
  </button>

  <script src="menu.js"></script>
  <script src="app.js"></script>
</body>
</html>
